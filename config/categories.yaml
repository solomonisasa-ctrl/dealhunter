# Pluggable category definitions.
#
# Each category describes a collectible domain: which subreddits/eBay category
# IDs to search by default, and which structured fields the criteria parser
# should try to extract from a plain-English hunt description. Core matching/
# scoring code (src/dealhunter/) never hardcodes "watches" - it only reads
# whatever categories are defined here, so adding a new category (e.g.
# "sneakers", "trading_cards") later is a config change, not a code change.

watches:
  display_name: Watches
  # reddit block temporarily disabled - Reddit's Data API now requires an
  # approved access request before app credentials work at all (see
  # https://github.com/solomonisasa-ctrl/dealhunter README for context).
  # Request submitted 2026-07-21, pending review. Once approved, restore
  # this block (uncomment) and fill in REDDIT_* in .env / repo secrets:
  # reddit:
  #   subreddits:
  #     - watchexchange
  #     - vintagewatches
  #     - omega
  #     - Seiko
  #     - rolex
  ebay:
    # eBay category ID 31387 = "Watches, Parts & Accessories" (Wristwatches).
    category_ids:
      - "31387"
  etsy:
    # Etsy taxonomy 2831 = Jewelry > Watches > Wrist Watches. Without this,
    # keyword search runs across all of Etsy and pulls in straps/bands,
    # sunglasses, art prints, and other non-watch junk that happens to
    # mention the brand/model in its title or tags - found via
    # GET /v3/application/seller-taxonomy/nodes.
    taxonomy_id: 2831
  # Title phrases that mean a listing is an accessory, replacement part, or
  # art/media item rather than the actual watch itself - filtered out
  # before spending a Claude call on it (src/dealhunter/junk_filter.py).
  # A category-driven keyword search matches on brand/model text alone, so
  # it also surfaces straps, prints, and other unrelated products that
  # mention the same words. Keep phrases specific/multi-word (e.g. "strap
  # for" not bare "strap") so a genuine watch listing that mentions its own
  # strap/bracelet isn't excluded by mistake. This mechanism - and the list
  # itself - is per-category, so a future category (e.g. "sneakers")
  # defines its own without touching any code.
  junk_title_phrases:
    - strap for
    - band for
    - bracelet for
    - compatible with
    - replacement strap
    - replacement band
    - replacement bracelet
    - watch strap
    - watch band
    - watch bracelet
    - sketch
    - wall art
    - art print
    - poster
    - sunglasses
    - eyeglasses
  # Fields the criteria parser (src/dealhunter/criteria_parser.py) is asked
  # to extract from plain English. Any field it can't confidently extract is
  # left null - the analyzer still gets the raw plain-English text either way.
  structured_fields:
    - brand
    - model
    - reference_number
    - condition_min
    - box_and_papers_required
    - max_price_all_in
    - other_requirements
