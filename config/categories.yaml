# Pluggable category definitions.
#
# Each category describes a collectible domain: which subreddits/eBay category
# IDs to search by default, and which structured fields the criteria parser
# should try to extract from a plain-English hunt description. Core matching/
# scoring code (src/dealhunter/) never hardcodes "watches" - it only reads
# whatever categories are defined here, so adding a new category (e.g.
# "sneakers", "trading_cards") later is a config change, not a code change.

watches:
  display_name: Watches
  # reddit block temporarily disabled - Reddit's Data API now requires an
  # approved access request before app credentials work at all (see
  # https://github.com/solomonisasa-ctrl/dealhunter README for context).
  # Request submitted 2026-07-21, pending review. Once approved, restore
  # this block (uncomment) and fill in REDDIT_* in .env / repo secrets:
  # reddit:
  #   subreddits:
  #     - watchexchange
  #     - vintagewatches
  #     - omega
  #     - Seiko
  #     - rolex
  ebay:
    # eBay category ID 31387 = "Watches, Parts & Accessories" (Wristwatches).
    category_ids:
      - "31387"
  # etsy block disabled until you've created an app at etsy.com/developers/
  # your-apps and filled in ETSY_KEYSTRING + ETSY_SHARED_SECRET in .env /
  # repo secrets (unlike Reddit, this is self-serve - no approval wait).
  # Uncomment once that's done:
  # etsy:
  #   # Optional: narrow results to a specific Etsy taxonomy (category) ID.
  #   # Etsy doesn't publish a simple lookup table for these - call
  #   # GET /v3/application/seller-taxonomy/nodes (or buyer-taxonomy/nodes)
  #   # to find the right one for "Watches" and set it here. Left unset for
  #   # now, so search runs marketplace-wide (still keyword-scoped, just
  #   # not category-restricted).
  #   taxonomy_id: null
  # Fields the criteria parser (src/dealhunter/criteria_parser.py) is asked
  # to extract from plain English. Any field it can't confidently extract is
  # left null - the analyzer still gets the raw plain-English text either way.
  structured_fields:
    - brand
    - model
    - reference_number
    - condition_min
    - box_and_papers_required
    - max_price_all_in
    - other_requirements
